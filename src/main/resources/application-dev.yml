spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop     # 테이블 자동 생성/갱신
    show-sql: true              # 실행되는 SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true        # SQL 보기 좋게 정렬

springdoc:
  swagger-ui:
    enabled: true